<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexora Pairing</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#12254a;background:#f5f8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;justify-content:center;padding:28px 16px;background:linear-gradient(160deg,#f5f8ff,#eef4ff)}.wrap{width:min(900px,100%)}.hero{background:linear-gradient(135deg,#146ef5,#5b8df8);color:white;border-radius:28px;padding:28px;box-shadow:0 18px 45px #146ef52b}h1{margin:0 0 6px;font-size:32px}.sub{opacity:.9}.panel{margin-top:18px;background:white;border-radius:24px;padding:20px;box-shadow:0 12px 35px #12254a12}label{display:block;font-weight:700;margin-bottom:8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.row{grid-template-columns:1fr}}input,select,button{width:100%;border:1px solid #dce5f5;border-radius:14px;padding:13px 14px;font-size:15px}button{border:0;background:#146ef5;color:white;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}@media(max-width:650px){.slots{grid-template-columns:1fr}}.slot{border:1px solid #e0e8f7;border-radius:18px;padding:15px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#a9b5c8;margin-right:6px}.open .dot{background:#18c77a}.pairing .dot{background:#f5a623}.code{font:800 22px ui-monospace,monospace;letter-spacing:2px;margin-top:8px}.qr{max-width:190px;width:100%;display:block;margin:12px auto;border-radius:12px}.muted{color:#71819e;font-size:13px}.result{margin-top:14px;padding:14px;border-radius:14px;background:#f5f8ff;display:none}.error{color:#c62828}.ok{color:#167b49}.footer{margin-top:14px;text-align:center;color:#7b8ba7;font-size:12px}
</style>
</head>
<body><main class="wrap">
<section class="hero"><h1>🤖 Nexora</h1><div class="sub">Multi-device WhatsApp pairing</div></section>
<section class="panel"><h2>Pair a device</h2><p class="muted">Choose an empty slot, enter the WhatsApp number with country code, then generate a pairing code.</p><div class="row"><div><label>Session slot</label><select id="slot"><option value="1">Session 1</option><option value="2">Session 2</option><option value="3">Session 3</option></select></div><div><label>Phone number</label><input id="phone" inputmode="numeric" placeholder="263781234567"></div></div><button id="pair" style="margin-top:12px">Generate Pairing Code</button><div id="result" class="result"></div></section>
<section class="panel"><h2>Sessions</h2><div id="slots" class="slots"></div></section><div class="footer">Nexora Bot Mini • 3 sessions per deployment</div></main>
<script>
const slotsEl=document.getElementById('slots');const result=document.getElementById('result');const btn=document.getElementById('pair');
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(data){slotsEl.innerHTML='';data.sessions.forEach(s=>{const card=document.createElement('div');card.className='slot '+(s.connection==='open'?'open':s.pairingCode?'pairing':'');let html='<b>Session '+esc(s.slot)+'</b><div class="muted"><span class="dot"></span>'+esc(s.connection)+'</div>';if(s.botId)html+='<div class="muted">'+esc(s.botId)+'</div>';if(s.pairingCode)html+='<div class="code">'+esc(s.pairingCode)+'</div>';if(s.qrDataUrl)html+='<img class="qr" src="'+s.qrDataUrl+'" alt="QR code">';card.innerHTML=html;slotsEl.appendChild(card);});}
async function refresh(){try{const r=await fetch('/api/sessions');const d=await r.json();if(d.success)render(d);}catch{}}
btn.onclick=async()=>{btn.disabled=true;result.style.display='block';result.className='result';result.textContent='Generating pairing code...';try{const r=await fetch('/api/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slot:Number(document.getElementById('slot').value),phone:document.getElementById('phone').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Pairing failed');result.className='result ok';result.innerHTML='<b>Pairing code:</b><div class="code">'+esc(d.code)+'</div><div class="muted">WhatsApp → Linked devices → Link a device → Link with phone number</div>';await refresh();}catch(e){result.className='result error';result.textContent=e.message;}finally{btn.disabled=false;}};
refresh();setInterval(refresh,3000);
</script></body></html>
